# ver2(상업용 시안) — https://fx-monitor-v2.pages.dev
# 만들기: python v2/build_v2.py  → 배포: (v2 폴더에서) npx wrangler pages deploy --branch main --commit-dirty=true
name = "fx-monitor-v2"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# 커뮤니티 — 본 사이트(fx-monitor)와 같은 D1. 비밀 값 COMMUNITY_KEY 도 같은 값이어야 비밀번호가 맞는다.
[[d1_databases]]
binding = "CDB"
database_name = "fx-community"
database_id = "0d599547-a8b6-4fa9-8074-9620bfdc4b0a"
