name: update-data

on:
  schedule:
    # 시간은 UTC. 장중 데이터는 5분마다(GitHub 사정으로 늦어질 수 있음).
    # UTC 월~금 = KST 월 09시 ~ 토 09시, UTC 일 21~23시 = KST 월 06~09시.
    # 매매기준율은 같은 실행에서 KST 8~13시에 오늘 값이 없을 때만 요청한다.
    - cron: "*/5 * * * 1-5"
    - cron: "*/5 21-23 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "매매기준율 전체 다시 받기(2000년부터)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 매매기준율 수집 (서울외국환중개)
        continue-on-error: true
        run: python scripts/fetch_smbs.py ${{ github.event_name == 'schedule' && '--auto' || '' }} ${{ inputs.full && '--full' || '' }}

      - name: 장중 데이터 수집 (Yahoo KRW=X)
        continue-on-error: true
        run: |
          # 실패해도 사이트에서 직전 파일이 사라지지 않게 먼저 받아 둔다
          curl -sf "https://crucialp.github.io/usdkrw-live/intraday.json" -o docs/intraday.json || true
          python scripts/fetch_intraday.py

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/usdkrw_smbs.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
