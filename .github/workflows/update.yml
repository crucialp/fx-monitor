name: update-data

on:
  schedule:
    # 시간은 UTC. 평일 KST 09:20·10:20·12:20 (매매기준율은 아침에 한 번 고시, 나머지는 재시도·지연 대비)
    # 장중 시세·뉴스는 Cloudflare(fx-monitor.pages.dev)가 열 때마다 받아 오므로 여기서 하지 않는다.
    - cron: "20 0,1,3 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "매매기준율 전체 다시 받기(2000년부터)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 매매기준율 수집 (한국은행 ECOS 731Y001 · 서울외국환중개 고시값)
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/fetch_ecos_usdkrw.py ${{ github.event_name == 'schedule' && '--auto' || '' }} ${{ inputs.full && '--full' || '' }}

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/usdkrw_smbs.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin main
            git push
          fi

      # GitHub Pages(예비 주소 crucialp.github.io/fx-monitor). 본 사이트는 Cloudflare 라 여기 실패와 무관.
      # 가끔 GitHub 쪽에서 "artifact 를 못 찾음"(Fetching artifact metadata failed)으로 실패해서, 1분 쉬고 한 번 더 한다.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true   # .nojekyll 포함(v5 부터 점 파일은 기본 제외)

      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: 배포 재시도 전 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
